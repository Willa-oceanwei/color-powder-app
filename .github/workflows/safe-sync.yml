name: safe Turso to Sheets sync

on:
  schedule:
    # Run away from the top of the hour to reduce GitHub scheduler congestion.
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Run read-only preflight or apply safe insert/update events
        required: true
        type: choice
        default: dry-run
        options:
          - dry-run
          - apply
      batch_size:
        description: Maximum outbox events handled in this pass
        required: true
        default: "25"
      allow_deletes:
        description: Include baseline-protected lifecycle/delete events
        required: true
        type: boolean
        default: false
      delete_confirmation:
        description: For apply with deletes, enter APPLY SAFE DELETES
        required: false
        default: ""

permissions:
  contents: read
  issues: write

concurrency:
  group: turso-sheets-sync-worker
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_SHEET_URL: ${{ secrets.GOOGLE_SHEET_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate batch size
        env:
          # Scheduled runs have no workflow_dispatch inputs, so use the fixed safe batch.
          BATCH_SIZE: ${{ inputs.batch_size || '25' }}
        run: |
          python - <<'PY'
          import os
          value = int(os.environ["BATCH_SIZE"])
          if not 1 <= value <= 100:
              raise SystemExit("batch_size must be between 1 and 100")
          PY

      - name: Validate controlled delete confirmation
        if: inputs.mode == 'apply' && inputs.allow_deletes
        env:
          DELETE_CONFIRMATION: ${{ inputs.delete_confirmation }}
        run: |
          if [ "$DELETE_CONFIRMATION" != "APPLY SAFE DELETES" ]; then
            echo "Delete apply blocked: confirmation must exactly match APPLY SAFE DELETES"
            exit 2
          fi

      - name: Run read-only preflight
        if: inputs.mode == 'dry-run'
        env:
          DELETE_FLAG: ${{ inputs.allow_deletes && '--allow-deletes' || '' }}
        run: >-
          python scripts/run_safe_sync_worker.py
          --batch-size "${{ inputs.batch_size }}"
          --report-path reports/safe-sync-${{ github.run_id }}-${{ github.run_attempt }}.json
          $DELETE_FLAG

      - name: Apply safe insert and update events
        if: inputs.mode == 'apply'
        env:
          DELETE_FLAG: ${{ inputs.allow_deletes && '--allow-deletes' || '' }}
        run: >-
          python scripts/run_safe_sync_worker.py
          --batch-size "${{ inputs.batch_size }}"
          --report-path reports/safe-sync-${{ github.run_id }}-${{ github.run_attempt }}.json
          $DELETE_FLAG
          --apply

      - name: Apply scheduled baseline-protected events
        if: github.event_name == 'schedule'
        run: >-
          python scripts/run_safe_sync_worker.py
          --batch-size 25
          --report-path reports/safe-sync-${{ github.run_id }}-${{ github.run_attempt }}.json
          --allow-deletes
          --apply

      - name: Upload safe-sync observation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safe-sync-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.mode || 'scheduled-apply' }}
          path: reports/*.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Open or update sync failure alert
        if: failure()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/manage_sync_alert.py --status failure
          --workflow "safe Turso to Sheets sync"
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Resolve previous sync failure alert
        if: success()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/manage_sync_alert.py --status success
          --workflow "safe Turso to Sheets sync"
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
