name: safe Turso to Sheets sync

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run read-only preflight or apply safe insert/update events
        required: true
        type: choice
        default: dry-run
        options:
          - dry-run
          - apply
      batch_size:
        description: Maximum outbox events handled in this pass
        required: true
        default: "25"

permissions:
  contents: read

concurrency:
  group: safe-turso-to-sheets-worker
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_SHEET_URL: ${{ secrets.GOOGLE_SHEET_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate batch size
        env:
          BATCH_SIZE: ${{ inputs.batch_size }}
        run: |
          python - <<'PY'
          import os
          value = int(os.environ["BATCH_SIZE"])
          if not 1 <= value <= 100:
              raise SystemExit("batch_size must be between 1 and 100")
          PY

      - name: Run read-only preflight
        if: inputs.mode == 'dry-run'
        run: >-
          python scripts/run_safe_sync_worker.py
          --batch-size "${{ inputs.batch_size }}"
          --report-path reports/safe-sync-${{ github.run_id }}-${{ github.run_attempt }}.json

      - name: Apply safe insert and update events
        if: inputs.mode == 'apply'
        run: >-
          python scripts/run_safe_sync_worker.py
          --batch-size "${{ inputs.batch_size }}"
          --report-path reports/safe-sync-${{ github.run_id }}-${{ github.run_attempt }}.json
          --apply

      - name: Upload safe-sync observation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safe-sync-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.mode }}
          path: reports/*.json
          if-no-files-found: ignore
          retention-days: 14
