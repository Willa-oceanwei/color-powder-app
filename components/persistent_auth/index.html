<!doctype html>
<html>
  <head><meta charset="utf-8" /></head>
  <body>
    <script>
      const STORAGE_KEY = "color_powder_remember";
      const NO_TOKEN = "__browser_token_missing__";
      let hasResponded = false;

      function readToken() {
        try {
          return window.localStorage.getItem(STORAGE_KEY) || NO_TOKEN;
        } catch (error) {
          return NO_TOKEN;
        }
      }

      function sendValue(value) {
        hasResponded = true;
        window.parent.postMessage({
          isStreamlitMessage: true,
          type: "streamlit:setComponentValue",
          value: value,
          dataType: "json",
        }, "*");
      }

      window.addEventListener("message", (event) => {
        if (!event.data || event.data.type !== "streamlit:render") return;
        const args = event.data.args || {};
        if (args.token) {
          try {
            window.localStorage.setItem(STORAGE_KEY, args.token);
          } catch (error) {
            sendValue(NO_TOKEN);
            return;
          }
        } else if (args.clear) {
          try {
            window.localStorage.removeItem(STORAGE_KEY);
          } catch (error) {
            // Still acknowledge logout: the server session is already invalid.
          }
          // Remove cookies created by the earlier implementation as well.
          document.cookie = `${STORAGE_KEY}=; Max-Age=0; Path=/; SameSite=Lax`;
          sendValue("__browser_token_cleared__");
          return;
        }
        sendValue(readToken());
      });

      window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:componentReady",
        apiVersion: 1,
      }, "*");
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:setFrameHeight",
        height: 0,
      }, "*");

      // Never leave the Python app on its loading sentinel indefinitely if a
      // browser blocks storage or a render message is unexpectedly missed.
      window.setTimeout(() => {
        if (!hasResponded) sendValue(NO_TOKEN);
      }, 1500);
    </script>
  </body>
</html>
