<!doctype html>
<html>
  <head><meta charset="utf-8" /></head>
  <body>
    <script>
      const STORAGE_KEY = "color_powder_remember";

      function readToken() {
        return window.localStorage.getItem(STORAGE_KEY);
      }

      function sendValue(value) {
        window.parent.postMessage({
          isStreamlitMessage: true,
          type: "streamlit:setComponentValue",
          value: value,
        }, "*");
      }

      window.addEventListener("message", (event) => {
        if (!event.data || event.data.type !== "streamlit:render") return;
        const args = event.data.args || {};
        if (args.token) {
          window.localStorage.setItem(STORAGE_KEY, args.token);
        } else if (args.clear) {
          window.localStorage.removeItem(STORAGE_KEY);
          // Remove cookies created by the earlier implementation as well.
          document.cookie = `${STORAGE_KEY}=; Max-Age=0; Path=/; SameSite=Lax`;
          sendValue("__browser_token_cleared__");
          return;
        }
        sendValue(readToken());
      });

      window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:componentReady",
        apiVersion: 1,
      }, "*");
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:setFrameHeight",
        height: 0,
      }, "*");
    </script>
  </body>
</html>
